#
#    These are the periods that the server will wait before doing periodic duties. At the moment only
#    arena point calculation and honor point calculation are used here.
#
#    Default:
#         Arena: weekly
#         DailyQuests: daily
#             (blizzlike values)
#
#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#

[Periods]
DailyQuests = daily
ArenaUpdate = weekly
         
