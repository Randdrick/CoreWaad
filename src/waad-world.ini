#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#
# RelayChatIRC 
#
#   UseChatIrc
#
#        Specify whether you want to relay your server through an IRC server.
#        0: No IRC relay
#        1: Relay server chat to an IRC server
#        Note: If the variable does not exist, the default value is used.
#        Default: 0
#
#   ServPort
#
#        Specify the IRC server port here.
#        Note: If the variable does not exist, the default value is used.
#        Default: 6667
#
#   ServHostIp
#
#        Specify the IRC server IP address here (not the hostname).
#        Note: If the variable does not exist, the default value is used.
#        Default: 127.0.0.1
#
#   Chan
#
#        Specify the chat name to join here (including #).
#        Note: If the variable does not exist, the default value is used.
#        Default: #chat_to_join
#
#   BotNick
#
#        Specify the bot name displayed in the IRC chat here.
#        Note: If the variable does not exist, the default value is used.
#        Default: BotFromMyWowServer
#
#   BotName
#
#        Specify the name used by the bot to connect to the IRC server.
#        Note: If the variable does not exist, the default value is used.
#        Default: WowServerRobot
#
#   BotText
#
#        Specify the text displayed in IRC when the bot connects.
#        Note: If the variable does not exist, the default value is used.
#        Default: Active Server Relay.
#
#   PlayerConnect
#
#        Specify whether player connect/disconnect events should be relayed.
#        Note: If the variable does not exist, the default value is used.
#        Default: 1
#
#   ChannelWisp
#
#        Specify whether whispers should be relayed: "0" No, "1" Yes.
#        Note: If the variable does not exist, the default value is used.
#        Default: 0
#
#   ChannelGuilde
#
#        Specify whether guild chat should be relayed: "0" No, "1" Yes.
#        Note: If the variable does not exist, the default value is used.
#        Default: 0
#
#   ChatGeneral
#
#        Specify whether general chat should be relayed: "0" No, "1" Yes.
#        Note: If the variable does not exist, the default value is used.
#        Default: 1
#
#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#

[RelayChatIRC]
UseChatIrc     = 0
ServPort       = 6667
ServHostIp     = 127.0.0.1
Chan           = #chat_to_join
BotNick        = BotFromMyWowServer
BotName        = WaadIrcServerRelay
BotText        = Waad World Server Relay actif.
PlayerConnect  = 1
ChannelWisp    = 0 
ChannelGuilde  = 0
ChannelGeneral = 1

